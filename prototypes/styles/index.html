<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06090f">
  <title>Пробы стиля</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06090f;
      --ink: #ece6d6;
      --dim: rgba(236, 230, 214, 0.62);
      --line: rgba(236, 230, 214, 0.16);
      --accent: #f2c879;
      --box: rgba(10, 12, 18, 0.78);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 28px 16px 64px; }
    main { max-width: 980px; margin: 0 auto; }
    header h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: clamp(32px, 8vw, 52px); margin: 0 0 8px; }
    header p { color: var(--dim); line-height: 1.5; margin: 0 0 8px; max-width: 42em; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 30px; }
    nav a { color: var(--ink); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 14px; }
    section { margin-bottom: 52px; }
    section h2 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 28px; margin: 0 0 4px; color: var(--accent); }
    section .note { color: var(--dim); font-size: 14px; margin: 0 0 14px; line-height: 1.45; }
    .stage { position: relative; width: 100%; aspect-ratio: 3 / 2; overflow: hidden; border-radius: 14px; background: #111722; border: 1px solid var(--line); }
    .stage > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .stage > img.sprite { position: absolute; right: 4%; bottom: 0; height: 92%; width: auto; transition: opacity 0.4s; filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.45)); }
    .stage.nosprite > img.sprite { opacity: 0; }
    .say { position: absolute; left: 3%; right: 3%; bottom: 4%; background: var(--box); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px 14px; backdrop-filter: blur(3px); }
    .say b { display: block; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 17px; color: var(--accent); font-weight: 600; margin-bottom: 2px; }
    .say span { font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(15px, 2.6vw, 21px); line-height: 1.3; }
    .missing { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 14px; }
    .row { display: flex; gap: 10px; margin-top: 10px; }
    .row button { font: inherit; font-size: 14px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
    .row a { color: var(--dim); font-size: 14px; align-self: center; }
    @media (max-width: 560px) {
      .say { padding: 8px 10px 10px; }
      .say b { font-size: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Пробы стиля</h1>
      <p>Одна и та же сцена из «Майской ночи» и один персонаж — голова Евтух Макогоненко — в четырёх стилях. Фон и персонаж генерируются отдельно и складываются, как в визуальной новелле.</p>
      <p>Нажмите «Без персонажа», чтобы увидеть фон целиком.</p>
    </header>
    <nav id="nav"></nav>
    <div id="list"></div>
  </main>
  <script>
    const STYLES = [
      { id: 'engraving', name: 'Гравюра', note: 'Книжная иллюстрация XIX века: штриховка, сепия, как в старых изданиях Гоголя.' },
      { id: 'kuindzhi', name: 'Масло, Куинджи', note: 'Светящаяся лунная ночь в духе «Украинской ночи» (1876).' },
      { id: 'lubok', name: 'Лубок', note: 'Народная раскрашенная гравюра: яркие пятна, наивная перспектива, орнамент.' },
      { id: 'watercolor', name: 'Акварель', note: 'Мягкая книжная акварель с тонкой линией, сказочно и много воздуха.' },
    ];
    const LINE = 'Голова крив; но зато одинокий глаз его злодей и далеко может увидеть хорошенькую поселянку.';
    const nav = document.getElementById('nav');
    const list = document.getElementById('list');
    for (const s of STYLES) {
      const a = document.createElement('a');
      a.href = '#' + s.id; a.textContent = s.name;
      nav.appendChild(a);
      const sec = document.createElement('section');
      sec.id = s.id;
      sec.innerHTML = `
        <h2>${s.name}</h2>
        <p class="note">${s.note}</p>
        <div class="stage">
          <div class="missing">Картинка ещё генерируется…</div>
          <img class="bg" alt="Хата над ставом, ${s.name}" src="img/hut-${s.id}.webp">
          <img class="sprite" alt="Голова Евтух, ${s.name}" src="img/golova-${s.id}.webp">
          <div class="say"><b>Рудый Панько</b><span>${LINE}</span></div>
        </div>
        <div class="row">
          <button type="button">Без персонажа</button>
          <a href="img/hut-${s.id}.webp">фон</a>
          <a href="img/golova-${s.id}.webp">персонаж</a>
        </div>`;
      const stage = sec.querySelector('.stage');
      for (const img of stage.querySelectorAll('img')) {
        img.addEventListener('error', () => { img.style.display = 'none'; });
        img.addEventListener('load', () => { if (img.classList.contains('bg')) stage.querySelector('.missing').remove(); });
      }
      const btn = sec.querySelector('button');
      btn.addEventListener('click', () => {
        stage.classList.toggle('nosprite');
        btn.textContent = stage.classList.contains('nosprite') ? 'С персонажем' : 'Без персонажа';
      });
      list.appendChild(sec);
    }
  </script>
</body>
</html>
