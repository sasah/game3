<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Объём картины</title>
  <style>
    :root { --bg: #05070c; --ink: #ece6d6; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #hint { position: fixed; left: 16px; bottom: 14px; font-size: 13px; opacity: 0.7; }
  </style>
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hint">Картина, натянутая на собственную глубину. Ведите пальцем — камера чуть поворачивается.</div>
  <script type="module">
    // The painting displaced by its own estimated depth: a relief that shows volume when the
    // camera turns a few degrees. Triangles across big depth jumps are dropped instead of stretched.
    import * as THREE from 'three';
    import * as S from '../src/scene.js';
    const params = new URLSearchParams(location.search);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(2, devicePixelRatio));
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070c);
    const base = S.makeCamera();
    const cam = base.clone();
    const W = base.right - base.left, H = base.top - base.bottom;
    const load = (u, nearest) => new Promise((r) => new THREE.TextureLoader().load(u, (t) => {
      t.colorSpace = THREE.NoColorSpace;
      if (nearest) { t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; }
      r(t);
    }));
    const [color, depth] = await Promise.all([load('../img/yard-kuindzhi.webp'), load('../img/depth-kuindzhi.png', true)]);
    const geo = new THREE.PlaneGeometry(W, H, 480, 320);
    const mat = new THREE.ShaderMaterial({
      uniforms: { uColor: { value: color }, uDepth: { value: depth }, uNear: { value: base.near }, uFar: { value: base.far } },
      vertexShader: `
        uniform sampler2D uDepth; uniform float uNear, uFar;
        varying vec2 vUv; varying float vZ;
        void main() {
          vUv = uv;
          vec3 e = texture2D(uDepth, uv).rgb;
          float d = dot(e, vec3(1.0, 1.0 / 255.0, 1.0 / 65025.0));
          vZ = uNear + d * (uFar - uNear);
          vec3 p = vec3(position.xy, -vZ);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
        }`,
      fragmentShader: `
        uniform sampler2D uColor; varying vec2 vUv; varying float vZ;
        void main() {
          if (fwidth(vZ) > 0.9) discard;
          gl_FragColor = vec4(texture2D(uColor, vUv).rgb, 1.0);
        }`,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set((base.left + base.right) / 2, (base.top + base.bottom) / 2, 0);
    const pivot = new THREE.Object3D();
    pivot.matrixAutoUpdate = false;
    pivot.matrix.copy(base.matrixWorld);
    pivot.add(mesh);
    scene.add(pivot);

    const target = S.CAMERA.target.clone().add(new THREE.Vector3(0, 1.5, 0));
    let yaw = 0, pitch = 0, tYaw = 0, tPitch = 0;
    function place() {
      const r = S.CAMERA.distance;
      const a = S.CAMERA.yaw + yaw, b = S.CAMERA.pitch + pitch;
      cam.position.set(target.x + Math.sin(a) * Math.cos(b) * r, target.y + Math.sin(b) * r, target.z + Math.cos(a) * Math.cos(b) * r);
      cam.lookAt(target);
      const asp = innerWidth / innerHeight;
      const vh = Math.min(H, W / asp) * 0.92;
      cam.left = -vh * asp / 2; cam.right = vh * asp / 2; cam.top = vh / 2; cam.bottom = -vh / 2;
      cam.updateProjectionMatrix();
    }
    addEventListener('pointermove', (e) => {
      tYaw = (e.clientX / innerWidth - 0.5) * 0.22;
      tPitch = (0.5 - e.clientY / innerHeight) * 0.08;
    });
    const shot = params.has('frame');
    if (shot) { const f = Number(params.get('frame')); const amp = Number(params.get("amp") || 0.1); yaw = tYaw = Math.sin(f / 36 * Math.PI * 2) * amp; pitch = tPitch = Math.cos(f / 36 * Math.PI * 2) * amp * 0.25; }
    function frame(t) {
      if (!shot && !matchMedia('(pointer: fine)').matches) { tYaw = Math.sin(t / 2200) * 0.1; tPitch = Math.cos(t / 2600) * 0.025; }
      yaw += (tYaw - yaw) * 0.08; pitch += (tPitch - pitch) * 0.08;
      renderer.setSize(innerWidth, innerHeight, false);
      place();
      renderer.render(scene, cam);
      if (shot) { window.__shotReady = true; return; }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
