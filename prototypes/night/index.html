<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#04070d">
  <title>Украинская ночь</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #e9e4d4;
      --ink-dim: rgba(233, 228, 212, 0.62);
      --night: #04070d;
      --accent: #f2c879;
    }
    html, body { margin: 0; height: 100%; background: var(--night); overflow: hidden; }
    body { color: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }
    canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #fade { position: fixed; inset: 0; background: #000; pointer-events: none; transition: opacity 3.5s ease; }
    #fade.gone { opacity: 0; }
    #overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 16px; box-sizing: border-box; text-align: center;
      background: radial-gradient(120% 90% at 50% 110%, #0d2032 0%, #06101c 55%, #03060b 100%);
      transition: opacity 1.6s ease;
    }
    #overlay.gone { opacity: 0; pointer-events: none; }
    h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: clamp(34px, 8vw, 64px); letter-spacing: 0.02em; margin: 0 0 18px; }
    blockquote { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: clamp(19px, 4.6vw, 27px); line-height: 1.35; max-width: 34em; margin: 0 0 8px; color: var(--ink); }
    cite { display: block; font-style: normal; font-size: 13px; letter-spacing: 0.04em; color: var(--ink-dim); margin-bottom: 36px; }
    button#enter {
      font: inherit; font-size: 17px; letter-spacing: 0.06em; color: var(--night); background: var(--accent);
      border: 0; border-radius: 999px; padding: 14px 30px; cursor: pointer; box-shadow: 0 0 40px rgba(242, 200, 121, 0.25);
    }
    button#enter:disabled { background: rgba(233, 228, 212, 0.18); color: var(--ink-dim); box-shadow: none; cursor: default; }
    #status, #hint { font-size: 13px; color: var(--ink-dim); margin-top: 16px; min-height: 1.2em; max-width: 30em; line-height: 1.45; }
    #help {
      position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      font-size: 14px; color: var(--ink); background: rgba(4, 7, 13, 0.45); padding: 8px 16px; border-radius: 999px;
      opacity: 0; transition: opacity 1.2s ease; pointer-events: none; white-space: nowrap;
    }
    #help.on { opacity: 1; }
    #stick { position: fixed; width: 104px; height: 104px; margin: -52px 0 0 -52px; border-radius: 50%; border: 1.5px solid rgba(233, 228, 212, 0.35); opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    #stick.on { opacity: 1; }
    #knob { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(233, 228, 212, 0.28); }
    #fps { position: fixed; right: 10px; top: 10px; font: 12px ui-monospace, monospace; color: var(--ink-dim); display: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="c" tabindex="0"></canvas>
  <div id="fade"></div>
  <div id="stick"><div id="knob"></div></div>
  <div id="help"></div>
  <div id="fps"></div>
  <div id="overlay">
    <h1>Украинская ночь</h1>
    <blockquote>«Знаете ли вы украинскую ночь? О, вы не знаете украинской ночи!»</blockquote>
    <cite>Н. В. Гоголь, «Майская ночь, или Утопленница»</cite>
    <button id="enter" disabled>Подождите…</button>
    <div id="status"></div>
    <div id="hint"></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
