<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#04070d">
  <title>Ревизская сказка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #e9e4d4; --dim: rgba(233, 228, 212, 0.6); --accent: #f2c879; }
    html, body { margin: 0; min-height: 100%; background: radial-gradient(120% 90% at 50% 110%, #0d2032 0%, #06101c 55%, #03060b 100%); color: var(--ink); }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; }
    main { max-width: 32em; text-align: center; }
    h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: clamp(34px, 9vw, 56px); margin: 0 0 6px; }
    p { color: var(--dim); line-height: 1.5; margin: 0 0 32px; }
    a.card { display: block; text-decoration: none; color: var(--ink); border: 1px solid rgba(233, 228, 212, 0.18); border-radius: 16px; padding: 18px 20px; margin-bottom: 12px; text-align: left; }
    a.card strong { display: block; font-size: 18px; margin-bottom: 4px; color: var(--accent); font-weight: 600; }
    a.card span { color: var(--dim); font-size: 14px; line-height: 1.45; }
  </style>
</head>
<body>
  <main>
    <h1>Ревизская сказка</h1>
    <p>Прототипы атмосферной детективной игры в мире Гоголя.</p>
    <a class="card" href="prototypes/night/">
      <strong>Украинская ночь</strong>
      <span>Тест атмосферы: майская ночь, ставок, белая хата на горе. Лучше в наушниках.</span>
    </a>
  </main>
</body>
</html>
